{% extends "base.html" %}

{% block title %}
Edit Saree - Admin
{% endblock %}

{% block content %}

<section class="admin-form-page">

    <div class="admin-form-container">

        <h1>Edit Saree</h1>

        <form method="POST">

            <div class="form-group">

                <label>Saree Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ saree['name'] }}"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Category</label>

                    <select name="category" required>

                        <option value="Silk"
                            {% if saree['category'] == 'Silk' %}selected{% endif %}>
                            Silk
                        </option>

                        <option value="Cotton"
                            {% if saree['category'] == 'Cotton' %}selected{% endif %}>
                            Cotton
                        </option>

                        <option value="Designer"
                            {% if saree['category'] == 'Designer' %}selected{% endif %}>
                            Designer
                        </option>

                        <option value="Georgette"
                            {% if saree['category'] == 'Georgette' %}selected{% endif %}>
                            Georgette
                        </option>

                        <option value="Chiffon"
                            {% if saree['category'] == 'Chiffon' %}selected{% endif %}>
                            Chiffon
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Fabric</label>

                    <input
                        type="text"
                        name="fabric"
                        value="{{ saree['fabric'] }}"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Color</label>

                    <input
                        type="text"
                        name="color"
                        value="{{ saree['color'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Price (₹)</label>

                    <input
                        type="number"
                        name="price"
                        value="{{ saree['price'] }}"
                        min="1"
                        step="0.01"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>Stock</label>

                <input
                    type="number"
                    name="stock"
                    value="{{ saree['stock'] }}"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>Description</label>

                <textarea
                    name="description"
                    rows="5"
                    required
                >{{ saree['description'] }}</textarea>

            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="btn"
                >
                    Update Saree
                </button>

                <a
                    href="/admin/sarees"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}

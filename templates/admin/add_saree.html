{% extends "base.html" %}

{% block title %}
Add Saree - Admin
{% endblock %}

{% block content %}

<section class="admin-form-page">

    <div class="admin-form-container">

        <h1>Add New Saree</h1>

        <form method="POST" enctype="multipart/form-data">

            <div class="form-group">

                <label>Saree Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Example: Mysore Silk Saree"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Category</label>

                    <select name="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Silk">
                            Silk
                        </option>

                        <option value="Cotton">
                            Cotton
                        </option>

                        <option value="Designer">
                            Designer
                        </option>

                        <option value="Georgette">
                            Georgette
                        </option>

                        <option value="Chiffon">
                            Chiffon
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Fabric</label>

                    <input
                        type="text"
                        name="fabric"
                        placeholder="Example: Pure Silk"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Color</label>

                    <input
                        type="text"
                        name="color"
                        placeholder="Example: Red"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Price (₹)</label>

                    <input
                        type="number"
                        name="price"
                        min="1"
                        step="0.01"
                        placeholder="Example: 2500"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>Stock</label>

                <input
                    type="number"
                    name="stock"
                    min="0"
                    placeholder="Example: 20"
                    required
                >

            </div>
            <div class="form-group">
                <label>Saree Image</label>
                <input
                    type="file"
                    name="image"
                    accept="image/*">
            </div>

                <div class="form-group">
                <label>Description</label>
                <textarea
                    name="description"
                    rows="5"
                    placeholder="Describe the saree..."
                    required></textarea>

            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="btn"
                >
                    Add Saree
                </button>

                <a
                    href="/admin/sarees"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}

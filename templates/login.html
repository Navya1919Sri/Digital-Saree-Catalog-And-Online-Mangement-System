{% extends "base.html" %}

{% block title %}
Login - Digital Saree Catalog
{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Login</h2>

    <form method="POST">

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">Register</a>
    </p>

</div>

{% endblock %}
